backend:
  name: git-gateway
  branch: main

media_folder: images
public_folder: /images

locale: nl

collections:
  - name: settings
    label: Instellingen
    files:
      - name: general
        label: Algemene instellingen
        file: data/settings.json
        fields:
          - label: Naam schilder
            name: name
            widget: string
            hint: Verschijnt in navigatie en hero
          - label: Telefoonnummer
            name: phone
            widget: string
          - label: E-mailadres
            name: email
            widget: string
          - label: Werkgebied
            name: area
            widget: string
            hint: bijv. Hilversum & omgeving
          - label: Hero tekst (NL)
            name: hero_nl
            widget: text
          - label: Hero tekst (EN)
            name: hero_en
            widget: text

  - name: photos
    label: Foto galerie
    label_singular: Foto
    folder: data/photos
    create: true
    slug: "{{slug}}"
    fields:
      - label: Titel (NL)
        name: title_nl
        widget: string
        hint: bijv. Garagedeur, Kozijnen
      - label: Titel (EN)
        name: title_en
        widget: string
      - label: Foto
        name: image
        widget: image
      - label: Categorie
        name: category
        widget: select
        options:
          - label: Voor/Na
            value: voor_na
          - label: Interieur
            value: interieur
          - label: Exterieur
            value: exterieur
          - label: Detail
            value: detail

  - name: reviews
    label: Ervaringen
    label_singular: Ervaring
    folder: data/reviews
    create: true
    slug: "{{slug}}"
    fields:
      - label: Naam
        name: name
        widget: string
      - label: Locatie
        name: location
        widget: string
        hint: bijv. Hilversum
      - label: Beoordeling (1-5)
        name: rating
        widget: number
        min: 1
        max: 5
        default: 5
      - label: Tekst (NL)
        name: text_nl
        widget: text
      - label: Tekst (EN)
        name: text_en
        widget: text
      - label: Goedgekeurd
        name: approved
        widget: boolean
        default: false
        hint: Vink aan om de review op de website te tonen
